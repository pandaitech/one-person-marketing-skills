<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Membina Marketing Brain</title>
<!--
  Marketing Brain setup panel (shown beside the chat while the interview runs).
  AGENT: copy this file unchanged. After every answer, update ONLY these two blocks:
    1. <script id="setup-state" type="application/json">  progress + the question being asked now
    2. <script id="brain-data" type="text/markdown">      the brain draft so far (format-brain.md)
  Write any "</script" inside them as "<\/script".
-->
<style>
:root {
  --bg: #F7F6F2; --surface: #FFFFFF; --soft: #EFEDE6; --ink: #151A1A; --body: #3D4545; --muted: #6A7373; --line: #E3E0D8;
  --accent: #7A3E7A; --accent-soft: #F4EBF4; --warn: #8A5A00; --warn-soft: #FBF1DC; --good: #1F6B47; --good-soft: #E5F3EB;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1414; --surface: #161D1D; --soft: #1E2727; --ink: #EEECE6; --body: #C8D0CF; --muted: #93A0A0; --line: #283333;
    --accent: #D3A6D3; --accent-soft: #2D2231; --warn: #E6C07A; --warn-soft: #30270F; --good: #86D1A8; --good-soft: #15291E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1414; --surface: #161D1D; --soft: #1E2727; --ink: #EEECE6; --body: #C8D0CF; --muted: #93A0A0; --line: #283333;
  --accent: #D3A6D3; --accent-soft: #2D2231; --warn: #E6C07A; --warn-soft: #30270F; --good: #86D1A8; --good-soft: #15291E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--body); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
h1 { margin: 0; color: var(--ink); font-size: 24px; line-height: 1.2; letter-spacing: -.01em; }

/* progress */
.progress { margin: 16px 0 18px; }
.progress-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.progress-top b { color: var(--ink); font-variant-numeric: tabular-nums; }
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.steps i { height: 6px; border-radius: 99px; background: var(--soft); }
.steps i.done { background: var(--accent); }
.steps i.now { background: var(--accent); opacity: .45; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .steps i.now { animation: none; } }

/* current question */
.ask { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px; }
.ask .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.ask .q { color: var(--ink); font-weight: 650; font-size: 16px; margin: 4px 0 6px; }
.ask .ex { color: var(--muted); font-size: 13px; margin: 0; }
.ask .ex::before { content: "Contoh: "; font-weight: 600; }
.ask .hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); }

/* sections */
.list { display: flex; flex-direction: column; gap: 10px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; transition: border-color .3s; }
.sec.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sec-head { display: flex; align-items: center; gap: 10px; }
.sec-head h2 { margin: 0; font-size: 15px; color: var(--ink); flex: 1; }
.badge { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.badge.full { background: var(--good-soft); color: var(--good); }
.badge.partial { background: var(--warn-soft); color: var(--warn); }
.badge.wait { border: 1.5px dashed var(--line); color: var(--muted); }
.state { font-size: 11px; color: var(--muted); font-weight: 600; }
.fields { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.fields li { font-size: 13.5px; line-height: 1.45; }
.fields li b { color: var(--ink); font-weight: 650; }
.fields li.sub { font-weight: 700; color: var(--ink); margin-top: 4px; font-size: 13px; }
.fields li.unsure { background: var(--warn-soft); border-radius: 6px; padding: 3px 8px; margin: 0 -8px; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.skeleton { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.skeleton i { display: block; height: 8px; border-radius: 99px; background: var(--soft); }
.skeleton i:nth-child(2) { width: 70%; }
.skeleton span { font-size: 12px; color: var(--muted); margin-top: 2px; }
.fresh { animation: fresh 1.4s ease-out; }
@keyframes fresh { from { background: var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { .fresh { animation: none; } }

.open { margin-top: 18px; }
.open h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12.5px; background: var(--warn-soft); color: var(--body); border-radius: 999px; padding: 4px 10px; }

/* done */
.finish { background: var(--good-soft); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
.finish h2 { margin: 0 0 4px; color: var(--good); font-size: 17px; }
.finish p { margin: 0 0 12px; font-size: 13.5px; }
.finish ol { margin: 0 0 12px; padding-left: 18px; font-size: 13.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; font-weight: 650; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(16px); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; transition: .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.error { background: var(--warn-soft); color: var(--warn); padding: 12px 14px; border-radius: var(--radius); font-size: 13px; }
</style>
</head>
<body>
<script id="setup-state" type="application/json">
{
  "langkah": 0,
  "jumlah": 10,
  "soalan": "Ada apa-apa yang saya boleh baca dulu? Link website, bio, menu atau post lama.",
  "contoh": "https://instagram.com/bisnes-anda, atau taip \"tiada\"",
  "bahagian_aktif": 0,
  "siap": false
}
</script>
<script id="brain-data" type="text/markdown">
# Marketing Brain: Bisnes anda
Dikemas kini: 2026-01-01

## 1. Bisnes
## 2. Brand & gaya bahasa
## 3. Produk & tawaran
## 4. Audience
## 5. Content
## 6. Iklan
## 7. Pengajaran
## 8. Belum pasti
</script>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const app = document.getElementById("app");
  const unesc = s => s.replace(/<\\\/script/gi, "</script");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const UNSURE = /\(belum pasti\)/i;
  // Which interview questions fill which section (references/soalan.md).
  const WHEN = { "1": "soalan 1 dan 2", "2": "soalan 6", "3": "soalan 3 dan 4", "4": "soalan 5", "5": "soalan 7 dan 8", "6": "soalan 9 dan 10" };

  let state, raw;
  try { state = JSON.parse(unesc(document.getElementById("setup-state").textContent)); }
  catch (e) { state = { langkah: 0, jumlah: 10 }; }
  raw = unesc(document.getElementById("brain-data").textContent).trim() + "\n";

  function inline(s) {
    let h = esc(s);
    h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/\s*\(belum pasti\)/gi, '<span class="tag">belum pasti</span>');
    return h;
  }

  function parse(text) {
    const lines = text.split(/\r?\n/);
    const title = (lines.find(l => /^#\s+/.test(l)) || "").replace(/^#\s+/, "").replace(/^Marketing Brain\s*[:\-–—]\s*/i, "").trim();
    const sections = [];
    let cur = null;
    for (const line of lines) {
      const m = line.match(/^##\s+(?:(\d+)\.\s*)?(.+)$/);
      if (m) { cur = { num: m[1] || String(sections.length + 1), name: m[2].trim(), lines: [] }; sections.push(cur); continue; }
      if (cur && line.trim()) cur.lines.push(line);
    }
    return { title, sections };
  }

  function status(sec) {
    const items = sec.lines.filter(l => /^\s*[-*]\s+/.test(l));
    if (!items.length) return "wait";
    if (items.every(l => UNSURE.test(l))) return "partial";
    return items.some(l => UNSURE.test(l)) ? "partial" : "full";
  }

  function fields(sec) {
    return sec.lines.map(l => {
      const h = l.match(/^###\s+(.*)$/);
      if (h) return `<li class="sub">${inline(h[1])}</li>`;
      const b = l.match(/^\s*[-*]\s+(.*)$/);
      if (b) return `<li class="${UNSURE.test(b[1]) ? "unsure" : ""}">${inline(b[1])}</li>`;
      return "";
    }).join("");
  }

  // Remember what was on screen last time, so new fields get a highlight after the agent updates the panel.
  function seen(key, value) {
    try { const prev = localStorage.getItem(key); localStorage.setItem(key, value); return prev; } catch (e) { return value; }
  }

  function render() {
    const { title, sections } = parse(raw);
    if (!sections.length) { app.innerHTML = `<div class="error">Format brain tidak dikenali. Setiap bahagian mesti bermula dengan "## 1. Bisnes" dan seterusnya.</div>`; return; }
    const core = sections.filter(s => !/pengajaran|belum pasti/i.test(s.name));
    const openSec = sections.find(s => /belum pasti/i.test(s.name));
    const open = openSec ? openSec.lines.map(l => (l.match(/^\s*[-*]\s+(.*)$/) || [])[1]).filter(Boolean).filter(t => !/^\(belum pasti\)$/i.test(t.trim())) : [];
    const total = Math.max(1, Number(state.jumlah) || 10);
    const step = Math.min(total, Math.max(0, Number(state.langkah) || 0));
    const finished = state.siap === true;
    const active = String(state.bahagian_aktif || "");

    let html = `<p class="eyebrow">${finished ? "Marketing Brain" : "Membina Marketing Brain"}</p>
      <h1>${esc(title || "Bisnes anda")}</h1>`;

    if (!finished) {
      html += `<div class="progress" aria-label="Kemajuan temu bual">
        <div class="progress-top"><span>${step === 0 ? "Bahan sedia ada" : "Soalan"}</span><b>${step} / ${total}</b></div>
        <div class="steps">${Array.from({ length: total }, (_, i) => `<i class="${i < step - 1 ? "done" : i === step - 1 ? "now" : ""}"></i>`).join("")}</div>
      </div>`;
      if (state.soalan) {
        html += `<div class="ask"><div class="label">${step === 0 ? "Sebelum mula" : `Soalan ${step}`}</div>
          <p class="q">${esc(state.soalan)}</p>${state.contoh ? `<p class="ex">${esc(state.contoh)}</p>` : ""}
          <p class="hint">Jawab dalam chat. Tak tahu? Taip "skip".</p></div>`;
      }
    } else {
      html += `<div class="finish"><h2>Brain siap</h2>
        <p>Simpan supaya semua skill lain boleh baca:</p>
        <ol><li>Muat turun <b>marketing-brain.md</b>.</li><li>Buka Project anda, bahagian Files (ChatGPT) atau Project knowledge (Claude).</li><li>Muat naik, ganti versi lama kalau ada.</li></ol>
        <div class="actions"><button type="button" id="download">Muat turun .md</button><button type="button" id="copy">Salin brain</button></div></div>`;
    }

    html += `<div class="list">` + core.map(s => {
      const st = status(s);
      const body = fields(s);
      const key = "brain-setup:" + s.num;
      const prev = seen(key, body);
      const isNew = prev !== null && prev !== body && st !== "wait";
      const label = st === "full" ? "Lengkap" : st === "partial" ? "Separa" : "Menunggu";
      const mark = st === "full" ? "✓" : st === "partial" ? "!" : esc(s.num);
      return `<section class="sec${active === s.num ? " active" : ""}${isNew ? " fresh" : ""}">
        <div class="sec-head"><span class="badge ${st}" aria-hidden="true">${mark}</span><h2>${esc(s.name)}</h2><span class="state">${label}</span></div>
        ${st === "wait" ? `<div class="skeleton"><i></i><i></i>${WHEN[s.num] ? `<span>Diisi pada ${WHEN[s.num]}</span>` : ""}</div>` : `<ul class="fields">${body}</ul>`}
      </section>`;
    }).join("") + `</div>`;

    if (open.length) html += `<div class="open"><h3>Belum pasti (${open.length})</h3><div class="chips">${open.map(t => `<span>${inline(t)}</span>`).join("")}</div></div>`;

    app.innerHTML = html;
    document.title = finished ? `Marketing Brain: ${title}` : "Membina Marketing Brain";
    bind();
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
  }
  function bind() {
    const c = document.getElementById("copy"), d = document.getElementById("download");
    if (c) c.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(raw); toast("Brain disalin"); }
      catch (e) {
        const ta = document.createElement("textarea"); ta.value = raw; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); toast("Brain disalin"); } catch (e2) { toast("Tak dapat salin."); }
        ta.remove();
      }
    });
    if (d) d.addEventListener("click", () => {
      try {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([raw], { type: "text/markdown;charset=utf-8" }));
        a.download = "marketing-brain.md"; document.body.appendChild(a); a.click(); a.remove();
        toast("Memuat turun marketing-brain.md");
      } catch (e) { toast("Muat turun disekat. Guna Salin brain."); }
    });
  }

  try { render(); } catch (e) { app.innerHTML = `<div class="error">Panel gagal dipaparkan: ${esc(e.message || e)}</div>`; }
})();
</script>
</body>
</html>
