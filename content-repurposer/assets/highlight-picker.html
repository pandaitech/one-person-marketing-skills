<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemilih Highlight</title>
<!--
  Highlight picker viewer (content-repurposer, mod Video pendek).
  AGENT: copy this file unchanged. Replace ONLY the JSON inside
  <script id="highlight-data" type="application/json"> ... </script>.
  Schema: skills/content-repurposer/references/format-highlights.md
-->
<style>
:root {
  --bg: #F7F6F2; --surface: #FFFFFF; --soft: #EFEDE6; --ink: #151A1A; --body: #3D4545; --muted: #6A7373; --line: #E3E0D8;
  --accent: #7A3E7A; --accent-soft: #F4EBF4; --warn: #8A5A00; --warn-soft: #FBF1DC; --good: #1F6B47; --good-soft: #E5F3EB; --bad: #A33A2E; --bad-soft: #FBE9E6;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1414; --surface: #161D1D; --soft: #1E2727; --ink: #EEECE6; --body: #C8D0CF; --muted: #93A0A0; --line: #283333;
    --accent: #D3A6D3; --accent-soft: #2D2231; --warn: #E6C07A; --warn-soft: #30270F; --good: #86D1A8; --good-soft: #15291E; --bad: #F0A39A; --bad-soft: #321A17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1414; --surface: #161D1D; --soft: #1E2727; --ink: #EEECE6; --body: #C8D0CF; --muted: #93A0A0; --line: #283333;
  --accent: #D3A6D3; --accent-soft: #2D2231; --warn: #E6C07A; --warn-soft: #30270F; --good: #86D1A8; --good-soft: #15291E; --bad: #F0A39A; --bad-soft: #321A17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--body); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 900px; margin: 0 auto; padding: 32px 16px 80px; }
header.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { margin: 0; color: var(--ink); font-size: clamp(24px, 5vw, 36px); line-height: 1.15; letter-spacing: -.02em; }
.meta { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.stat b { display: block; color: var(--ink); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
.chip { font: inherit; font-size: 13px; font-weight: 600; color: var(--body); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; }
.card.checked { border-color: var(--accent); }
.card input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.card .body { min-width: 0; flex: 1; }
.card .row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 6px; }
.rank { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 800; flex: none; }
.time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); font-size: 14px; }
.pillar { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 2px 9px; }
.hook { color: var(--ink); font-weight: 700; font-size: 16px; margin: 2px 0 6px; }
.field { margin: 6px 0; font-size: 14px; }
.field b { color: var(--ink); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; font-weight: 700; display: block; margin-bottom: 2px; color: var(--muted); }
.empty-note { color: var(--muted); font-style: italic; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.error { background: var(--bad-soft); color: var(--bad); padding: 16px; border-radius: var(--radius); }
@media print { .actions, .chips { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<script id="highlight-data" type="application/json">
{
  "business": "Nama Bisnes",
  "source": "Tiada sumber lagi",
  "highlights": []
}
</script>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Pemilih Highlight</p>
      <h1 id="title">Pemilih Highlight</h1>
      <p class="meta" id="source"></p>
    </div>
    <div class="actions">
      <button type="button" id="copySelected" disabled>Salin dipilih</button>
      <button type="button" id="copyAll">Salin semua</button>
    </div>
  </header>
  <section class="summary" id="summary" aria-label="Ringkasan"></section>
  <nav class="chips" id="chips" aria-label="Tapis ikut pillar"></nav>
  <main class="list" id="list"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  let DATA;
  try {
    DATA = JSON.parse(document.getElementById("highlight-data").textContent);
  } catch (e) {
    document.getElementById("list").innerHTML = `<div class="error">Data highlight rosak (JSON tidak sah): ${String(e.message || e)}</div>`;
    return;
  }

  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const items = Array.isArray(DATA.highlights) ? DATA.highlights.slice() : [];
  items.sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999));
  items.forEach((h, i) => { h._id = `${h.start || ""}-${h.end || ""}-${i}`; });

  document.getElementById("title").textContent = DATA.business ? `Highlight: ${DATA.business}` : "Pemilih Highlight";
  document.title = document.getElementById("title").textContent;
  document.getElementById("source").textContent = DATA.source ? `Sumber: ${DATA.source}` : "";

  if (!items.length) {
    document.getElementById("list").innerHTML = `<p class="empty-note">Tiada highlight lagi. Jalankan skill content-repurposer, mod video pendek, dengan satu transkrip.</p>`;
    document.getElementById("summary").style.display = "none";
    document.getElementById("copySelected").style.display = "none";
    document.getElementById("copyAll").style.display = "none";
    return;
  }

  const pillars = [...new Set(items.map(h => h.pillar).filter(Boolean))];
  let activePillar = "Semua";
  const selected = new Set();

  document.getElementById("summary").innerHTML = `
    <div class="stat"><b>${items.length}</b><span>Highlight ditemui</span></div>
    <div class="stat"><b id="selCount">0</b><span>Dipilih</span></div>
    <div class="stat"><b>${pillars.length || 1}</b><span>Content pillar</span></div>`;

  function renderChips() {
    const all = ["Semua", ...pillars];
    document.getElementById("chips").innerHTML = all.map(p =>
      `<button type="button" class="chip${p === activePillar ? " active" : ""}" data-pillar="${esc(p)}">${esc(p)}</button>`
    ).join("");
    document.getElementById("chips").querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => { activePillar = btn.dataset.pillar; renderChips(); renderList(); });
    });
  }

  function fmtHighlight(h) {
    const lines = [`${h.start || "?"}–${h.end || "?"} — ${h.hook || ""}`];
    if (h.on_screen_text) lines.push(`Teks skrin: ${h.on_screen_text}`);
    if (h.caption) lines.push(`Caption: ${h.caption}`);
    if (h.pillar) lines.push(`Pillar: ${h.pillar}`);
    return lines.join("\n");
  }

  function renderList() {
    const visible = activePillar === "Semua" ? items : items.filter(h => h.pillar === activePillar);
    document.getElementById("list").innerHTML = visible.map((h, i) => {
      const checked = selected.has(h._id);
      return `<div class="card${checked ? " checked" : ""}" data-id="${esc(h._id)}">
        <input type="checkbox" aria-label="Pilih highlight" ${checked ? "checked" : ""}>
        <div class="body">
          <div class="row1">
            <span class="rank">${esc(h.rank ?? i + 1)}</span>
            <span class="time">${esc(h.start || "?")}–${esc(h.end || "?")}</span>
            ${h.pillar ? `<span class="pillar">${esc(h.pillar)}</span>` : ""}
          </div>
          <p class="hook">${esc(h.hook || "(tiada hook)")}</p>
          ${h.why ? `<div class="field"><b>Kenapa menarik</b>${esc(h.why)}</div>` : ""}
          ${h.on_screen_text ? `<div class="field"><b>Teks di skrin</b>${esc(h.on_screen_text)}</div>` : ""}
          ${h.caption ? `<div class="field"><b>Caption</b>${esc(h.caption)}</div>` : ""}
        </div>
      </div>`;
    }).join("") || `<p class="empty-note">Tiada highlight untuk pillar ini.</p>`;

    document.getElementById("list").querySelectorAll(".card").forEach(card => {
      const id = card.dataset.id;
      const box = card.querySelector("input");
      box.addEventListener("change", () => {
        if (box.checked) selected.add(id); else selected.delete(id);
        card.classList.toggle("checked", box.checked);
        updateSelCount();
      });
    });
  }

  function updateSelCount() {
    document.getElementById("selCount").textContent = selected.size;
    document.getElementById("copySelected").disabled = selected.size === 0;
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  async function copyText(text, msg) {
    try { await navigator.clipboard.writeText(text); toast(msg); }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(msg); } catch (e2) { toast("Tak dapat salin. Pilih teks secara manual."); }
      ta.remove();
    }
  }

  document.getElementById("copySelected").addEventListener("click", () => {
    const chosen = items.filter(h => selected.has(h._id));
    if (!chosen.length) return;
    copyText(chosen.map(fmtHighlight).join("\n\n"), `${chosen.length} highlight disalin`);
  });
  document.getElementById("copyAll").addEventListener("click", () => {
    copyText(items.map(fmtHighlight).join("\n\n"), "Semua highlight disalin");
  });

  renderChips();
  renderList();
  updateSelCount();
})();
</script>
</body>
</html>
