<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Brain</title>
<!--
  Marketing Brain setup panel (shown beside the chat).
  AGENT: copy this file unchanged. Change ONLY these two blocks:
    1. <script id="setup-state" type="application/json">  {"mode": "borang"} for a new brain, {"mode": "brain"} once a brain exists
    2. <script id="brain-data" type="text/markdown">      the full marketing-brain.md (leave the template as is while mode is "borang")
  Write any "</script" inside them as "<\/script".
-->
<style>
:root {
  --bg: #F7F6F2; --surface: #FFFFFF; --soft: #EFEDE6; --ink: #151A1A; --body: #3D4545; --muted: #6A7373; --line: #E3E0D8;
  --accent: #7A3E7A; --accent-soft: #F4EBF4; --warn: #8A5A00; --warn-soft: #FBF1DC; --good: #1F6B47; --good-soft: #E5F3EB;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1414; --surface: #161D1D; --soft: #1E2727; --ink: #EEECE6; --body: #C8D0CF; --muted: #93A0A0; --line: #283333;
    --accent: #D3A6D3; --accent-soft: #2D2231; --warn: #E6C07A; --warn-soft: #30270F; --good: #86D1A8; --good-soft: #15291E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1414; --surface: #161D1D; --soft: #1E2727; --ink: #EEECE6; --body: #C8D0CF; --muted: #93A0A0; --line: #283333;
  --accent: #D3A6D3; --accent-soft: #2D2231; --warn: #E6C07A; --warn-soft: #30270F; --good: #86D1A8; --good-soft: #15291E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--body); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 96px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
h1 { margin: 0; color: var(--ink); font-size: 24px; line-height: 1.2; letter-spacing: -.01em; }
.lede { margin: 8px 0 16px; font-size: 14px; }

/* form */
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 6px; margin-bottom: 10px; }
.group h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 14px; color: var(--ink); }
.group h2 .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-size: 12px; flex: none; }
.group h2 .opt { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); }
label { display: block; margin-bottom: 10px; }
label span { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
textarea { width: 100%; min-height: 60px; resize: vertical; font: inherit; font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
textarea::placeholder { color: var(--muted); opacity: .85; }
textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.bar-in .count { font-size: 12.5px; color: var(--muted); flex: 1; }
.bar-in .count b { color: var(--ink); font-variant-numeric: tabular-nums; }
.primary { font: inherit; font-size: 14px; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
:root[data-theme="dark"] .primary { color: #151A1A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .primary { color: #151A1A; } }
.primary:hover { filter: brightness(1.08); }
.primary:disabled { opacity: .45; cursor: default; }
.fallback { display: none; margin-top: 12px; }
.fallback.show { display: block; }
.fallback p { font-size: 13px; margin: 0 0 6px; }
.fallback textarea { min-height: 140px; font-size: 12.5px; }

/* living brain */
.meta { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.save { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 16px; margin: 14px 0 16px; }
.save p { margin: 0 0 10px; font-size: 13.5px; }
.save details { font-size: 13px; margin: 0 0 10px; }
.save summary { cursor: pointer; font-weight: 650; color: var(--ink); }
.save ol { margin: 6px 0 0; padding-left: 18px; }
.grow { background: var(--surface); border: 1px dashed var(--accent); border-radius: var(--radius); padding: 14px; margin-top: 18px; }
.grow h3 { margin: 0 0 4px; font-size: 15px; color: var(--ink); }
.grow p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.grow .row { display: flex; justify-content: flex-end; margin-top: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button.ghost { font: inherit; font-size: 13px; font-weight: 650; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
button.ghost:hover { border-color: var(--accent); color: var(--accent); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.sec-head { display: flex; align-items: center; gap: 10px; }
.sec-head h2 { margin: 0; font-size: 15px; color: var(--ink); flex: 1; }
.badge { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.badge.full { background: var(--good-soft); color: var(--good); }
.badge.partial { background: var(--warn-soft); color: var(--warn); }
.badge.empty { border: 1.5px dashed var(--line); color: var(--muted); }
.state { font-size: 11px; color: var(--muted); font-weight: 600; }
.fields { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.fields li { font-size: 13.5px; line-height: 1.45; }
.fields li b { color: var(--ink); font-weight: 650; }
.lessons .fields li.sub { color: var(--accent); margin-top: 8px; }
.fields li.sub { font-weight: 700; color: var(--ink); margin-top: 4px; font-size: 13px; }
.fields li.unsure { background: var(--warn-soft); border-radius: 6px; padding: 3px 8px; margin: 0 -8px; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.open { margin-top: 18px; }
.open h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12.5px; background: var(--warn-soft); color: var(--body); border-radius: 999px; padding: 4px 10px; }
.toast { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%) translateY(16px); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; transition: .25s; pointer-events: none; z-index: 5; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.error { background: var(--warn-soft); color: var(--warn); padding: 12px 14px; border-radius: var(--radius); font-size: 13px; }
</style>
</head>
<body>
<script id="setup-state" type="application/json">
{ "mode": "borang" }
</script>
<script id="brain-data" type="text/markdown">
# Marketing Brain: Bisnes anda
Dikemas kini: 2026-01-01

## 1. Bisnes
## 2. Brand & gaya bahasa
## 3. Produk & tawaran
## 4. Audience
## 5. Content
## 6. Iklan
## 7. Pengajaran
## 8. Belum pasti
</script>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const app = document.getElementById("app");
  const unesc = s => s.replace(/<\\\/script/gi, "</script");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const UNSURE = /\(belum pasti\)/i;
  const DRAFT_KEY = "marketing-brain-borang";

  // The form. Every field is optional; the AI fills gaps with (belum pasti).
  const FORM = [
    { n: "✦", title: "Bahan sedia ada", opt: "Paling cepat", fields: [
      { id: "bahan", label: "Link atau teks yang AI boleh baca", ph: "Website, Instagram, TikTok, menu, senarai harga, atau tampal beberapa caption lama" } ] },
    { n: 1, title: "Bisnes", fields: [
      { id: "bisnes", label: "Apa yang anda jual, dan kepada siapa?", ph: "Nasi lemak bungkus untuk pekerja pejabat sekitar Shah Alam, jual di gerai dan GrabFood" },
      { id: "matlamat", label: "Matlamat 3 bulan akan datang", ph: "Naik dari 80 ke 150 bungkus sehari" } ] },
    { n: 2, title: "Produk & tawaran", fields: [
      { id: "produk", label: "Produk utama, harga, dan masalah yang diselesaikan", ph: "Set Nasi Lemak Ayam RM9. Sarapan kenyang yang siap dalam 2 minit" },
      { id: "bukti", label: "Bukti, tawaran semasa, dan cara orang beli", ph: "4.8 bintang di GrabFood. Beli 5 free teh tarik. Tempah melalui WhatsApp" } ] },
    { n: 3, title: "Audience", fields: [
      { id: "audience", label: "Pelanggan terbaik anda: masalah mereka, dan kenapa mereka ragu nak beli", ph: "Staf pejabat yang tak sempat sarapan. Takut sambal terlalu pedas" } ] },
    { n: 4, title: "Gaya bahasa", fields: [
      { id: "gaya", label: "Macam mana anda bercakap dengan pelanggan? Tampal satu caption pun boleh", ph: "Mesra, kelakar sikit, BM santai. Tak suka guna 'sis' dan 'bosku'" } ] },
    { n: 5, title: "Content", opt: "Pilihan", fields: [
      { id: "content", label: "Platform, kekerapan, dan post yang pernah menjadi", ph: "TikTok 3 kali seminggu. Video goreng ayam pukul 5 pagi dapat 200k views" } ] },
    { n: 6, title: "Iklan", opt: "Pilihan", fields: [
      { id: "iklan", label: "Bajet sebulan, objective, iklan yang menang dan yang rugi", ph: "RM600 sebulan, Messages ke WhatsApp. Menang: 'Sarapan RM9 sampai sebelum 9 pagi'" } ] },
    { n: "+", title: "Apa-apa lagi", opt: "Pilihan", fields: [
      { id: "lain", label: "Pesaing, cerita bisnes, apa sahaja yang AI patut tahu", ph: "Kedai mamak sebelah lebih murah, tapi tiada penghantaran pukal" } ] }
  ];
  const FIELDS = FORM.flatMap(g => g.fields.map(f => Object.assign({ group: g.title }, f)));

  let state, raw;
  try { state = JSON.parse(unesc(document.getElementById("setup-state").textContent)); } catch (e) { state = {}; }
  raw = unesc(document.getElementById("brain-data").textContent).trim() + "\n";
  const hasBrain = state.mode === "brain" || state.mode === "siap" || state.siap === true;

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}"); } catch (e) { return {}; } },
    set(v) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(v)); } catch (e) {} },
    clear() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  };

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
      ta.remove(); return ok;
    }
  }

  // ---------------------------------------------------------------- form mode
  function renderForm() {
    const draft = store.get();
    app.innerHTML = `<p class="eyebrow">Marketing Brain</p>
      <h1>Bina brain anda</h1>
      <p class="lede">Isi apa yang anda tahu. Semua pilihan, tak perlu lengkap. Kemudian tekan <b>Salin jawapan</b> dan tampal dalam chat. Atau terus taip dalam chat.</p>
      <form id="form" autocomplete="off">` +
      FORM.map(g => `<section class="group"><h2><span class="n">${esc(String(g.n))}</span>${esc(g.title)}${g.opt ? `<span class="opt">${esc(g.opt)}</span>` : ""}</h2>` +
        g.fields.map(f => `<label><span>${esc(f.label)}</span><textarea name="${f.id}" rows="2" placeholder="${esc(f.ph)}">${esc(draft[f.id] || "")}</textarea></label>`).join("") +
        `</section>`).join("") +
      `</form>
      <div class="fallback" id="fallback"><p>Salin teks di bawah secara manual, kemudian tampal dalam chat:</p><textarea id="out" readonly></textarea></div>
      <div class="bar"><div class="bar-in"><span class="count" id="count"></span><button class="primary" id="send" type="button">Salin jawapan</button></div></div>`;

    const form = document.getElementById("form");
    const count = document.getElementById("count");
    const send = document.getElementById("send");
    function values() { const v = {}; FIELDS.forEach(f => { v[f.id] = form.elements[f.id].value.trim(); }); return v; }
    function update() {
      const v = values(); store.set(v);
      const filled = FIELDS.filter(f => v[f.id]).length;
      count.innerHTML = `<b>${filled}</b> / ${FIELDS.length} diisi`;
      send.disabled = filled === 0;
    }
    form.addEventListener("input", update);
    update();

    send.addEventListener("click", async () => {
      const v = values();
      const text = "Ini jawapan saya untuk Marketing Brain. Bina brain penuh sekarang.\n\n" +
        FIELDS.filter(f => v[f.id]).map(f => `**${f.group}: ${f.label}**\n${v[f.id]}`).join("\n\n");
      const ok = await copy(text);
      const fb = document.getElementById("fallback");
      if (ok) { fb.classList.remove("show"); toast("Disalin. Tampal dalam chat dan hantar."); }
      else { document.getElementById("out").value = text; fb.classList.add("show"); document.getElementById("out").select(); }
    });
  }

  // ---------------------------------------------------------------- living brain
  function inline(s) {
    let h = esc(s);
    h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/\s*\(belum pasti\)/gi, '<span class="tag">belum pasti</span>');
    return h;
  }
  function parse(text) {
    const lines = text.split(/\r?\n/);
    const title = (lines.find(l => /^#\s+/.test(l)) || "").replace(/^#\s+/, "").replace(/^Marketing Brain\s*[:\-–—]\s*/i, "").trim();
    const sections = []; let cur = null;
    for (const line of lines) {
      const m = line.match(/^##\s+(?:(\d+)\.\s*)?(.+)$/);
      if (m) { cur = { num: m[1] || String(sections.length + 1), name: m[2].trim(), lines: [] }; sections.push(cur); continue; }
      if (cur && line.trim()) cur.lines.push(line);
    }
    return { title, sections };
  }
  function fmtDate(d) {
    const m = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return d;
    const bulan = ["Jan", "Feb", "Mac", "Apr", "Mei", "Jun", "Jul", "Ogos", "Sep", "Okt", "Nov", "Dis"];
    return `${Number(m[3])} ${bulan[Number(m[2]) - 1]} ${m[1]}`;
  }
  function status(sec) {
    const items = sec.lines.filter(l => /^\s*[-*]\s+/.test(l));
    if (!items.length || items.every(l => UNSURE.test(l))) return "empty";
    return items.some(l => UNSURE.test(l)) ? "partial" : "full";
  }
  function fields(sec) {
    return sec.lines.map(l => {
      const h = l.match(/^###\s+(.*)$/);
      if (h) return `<li class="sub">${inline(h[1])}</li>`;
      const b = l.match(/^\s*[-*]\s+(.*)$/);
      if (b) return `<li class="${UNSURE.test(b[1]) ? "unsure" : ""}">${inline(b[1])}</li>`;
      return "";
    }).join("");
  }
  function renderBrain() {
    store.clear();
    const { title, sections } = parse(raw);
    if (!sections.length) { app.innerHTML = `<div class="error">Format brain tidak dikenali. Setiap bahagian mesti bermula dengan "## 1. Bisnes" dan seterusnya.</div>`; return; }
    const core = sections.filter(s => !/pengajaran|belum pasti/i.test(s.name));
    const lessonSec = sections.find(s => /pengajaran/i.test(s.name));
    const lessonHtml = lessonSec && lessonSec.lines.some(l => /^###\s+/.test(l))
      ? `<section class="sec lessons"><div class="sec-head"><span class="badge full" aria-hidden="true">↻</span><h2>${esc(lessonSec.name)}</h2><span class="state">${lessonSec.lines.filter(l => /^###\s+/.test(l)).length} entri</span></div><ul class="fields">${fields(lessonSec)}</ul></section>`
      : `<section class="sec lessons"><div class="sec-head"><span class="badge empty" aria-hidden="true">↻</span><h2>Pengajaran</h2><span class="state">Belum ada</span></div><p class="meta">Masukkan prestasi content atau iklan minggu ini. Pengajaran akan terkumpul di sini.</p></section>`;
    const openSec = sections.find(s => /belum pasti/i.test(s.name));
    const open = openSec ? openSec.lines.map(l => (l.match(/^\s*[-*]\s+(.*)$/) || [])[1]).filter(Boolean).filter(t => !/^\(belum pasti\)$/i.test(t.trim())) : [];
    const label = { full: "Terisi", partial: "Separa", empty: "Kosong" };
    const mark = { full: "✓", partial: "!", empty: "" };
    const updated = ((raw.match(/^Dikemas kini\s*:\s*(.+)$/mi) || [])[1] || "").trim();
    app.innerHTML = `<p class="eyebrow">Marketing Brain</p><h1>${esc(title || "Bisnes anda")}</h1>
      ${updated ? `<p class="meta">Versi ${esc(fmtDate(updated))}</p>` : ""}
      <div class="save"><p>Brain ini tak pernah siap. Ia makin bijak setiap kali anda tambah maklumat baru atau prestasi minggu ini.</p>
        <details><summary>Simpan versi ini ke Project</summary><ol><li>Muat turun <b>marketing-brain.md</b>.</li><li>Buka Project anda, bahagian Files (ChatGPT) atau Project knowledge (Claude).</li><li>Muat naik dan ganti versi lama.</li></ol></details>
        <div class="actions"><button class="ghost" type="button" id="download">Muat turun .md</button><button class="ghost" type="button" id="copy">Salin brain</button></div></div>
      <div class="list">` + core.map(s => {
        const st = status(s);
        return `<section class="sec"><div class="sec-head"><span class="badge ${st}" aria-hidden="true">${mark[st] || esc(s.num)}</span><h2>${esc(s.name)}</h2><span class="state">${label[st]}</span></div>
          ${st === "empty" && !s.lines.length ? "" : `<ul class="fields">${fields(s)}</ul>`}</section>`;
      }).join("") + lessonHtml + `</div>` +
      (open.length ? `<div class="open"><h3>Belum pasti (${open.length})</h3><div class="chips">${open.map(t => `<span>${inline(t)}</span>`).join("")}</div></div>` : "") +
      `<div class="grow"><h3>Tambah ke brain</h3><p>Prestasi minggu ini, produk baru, jawapan kepada perkara belum pasti, apa sahaja yang AI patut tahu.</p>
        <textarea id="more" rows="3" placeholder="Video proses masak dapat 2x views berbanding poster promo. Sasaran kos WhatsApp: RM6."></textarea>
        <div class="row"><button class="primary" type="button" id="addmore">Salin & tampal dalam chat</button></div></div>`;
    document.title = `Marketing Brain: ${title}`;
    const more = document.getElementById("more");
    try { more.value = localStorage.getItem(DRAFT_KEY + "-tambah") || ""; } catch (e) {}
    more.addEventListener("input", () => { try { localStorage.setItem(DRAFT_KEY + "-tambah", more.value); } catch (e) {} });
    document.getElementById("addmore").addEventListener("click", async () => {
      const v = more.value.trim();
      if (!v) { more.focus(); return; }
      const ok = await copy("Kemas kini Marketing Brain saya dengan ini:\n\n" + v);
      if (ok) { toast("Disalin. Tampal dalam chat dan hantar."); try { localStorage.removeItem(DRAFT_KEY + "-tambah"); } catch (e) {} }
      else toast("Tak dapat salin. Taip terus dalam chat.");
    });
    document.getElementById("copy").addEventListener("click", async () => toast(await copy(raw) ? "Brain disalin" : "Tak dapat salin."));
    document.getElementById("download").addEventListener("click", () => {
      try {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([raw], { type: "text/markdown;charset=utf-8" }));
        a.download = "marketing-brain.md"; document.body.appendChild(a); a.click(); a.remove();
        toast("Memuat turun marketing-brain.md");
      } catch (e) { toast("Muat turun disekat. Guna Salin brain."); }
    });
  }

  try { hasBrain ? renderBrain() : renderForm(); }
  catch (e) { app.innerHTML = `<div class="error">Panel gagal dipaparkan: ${esc(e.message || e)}</div>`; }
})();
</script>
</body>
</html>
